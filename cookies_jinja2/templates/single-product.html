<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../static/css/styles.css" type="text/css" rel="stylesheet">
    {% from 'macros.html' import load_header, load_footer %}
    <title>Tech Shop</title>
</head>
<body>

    {{ load_header(get_user(request)) }}

    <div>
        <h1>Single Product - {{product.name}}</h1>
        
        <div class="grid-container-sp">
            <div class="grid-container-sp-inner-images">
                <a href="#img1">
                    <div class="grid-item-sp">
                        <img src="../static/images/oldpc1.png">
                    </div>
                </a>
                <div id="img1" class="lightbox">
                    <div class="image-container">
                        <a href="#">&times;</a>
                        <img src="../static/images/oldpc1.png">
                    </div>
                </div>
                <a href="#img2">
                    <div class="grid-item-sp">
                        <img src="../static/images/oldpc2.jpg">
                    </div>
                </a>
                <div id="img2" class="lightbox">
                    <div class="image-container">
                        <a href="#">&times;</a>
                        <img src="../static/images/oldpc2.jpg">
                    </div>
                </div>
                <a href="#img3">
                    <div class="grid-item-sp">
                        <img src="../static/images/oldpc3.jpg">
                    </div>
                </a>
                <div id="img3" class="lightbox">
                    <div class="image-container">
                        <a href="#">&times;</a>
                        <img src="../static/images/oldpc3.jpg">
                    </div>
                </div>
                <a href="#img4">
                    <div class="grid-item-sp">
                        <img src="../static/images/oldpc4.jpg">
                    </div>
                </a>
                <div id="img4" class="lightbox">
                    <div class="image-container">
                        <a href="#">&times;</a>
                        <img src="../static/images/oldpc4.jpg">
                    </div>
                </div>
            </div>
            <div class="grid-container-sp-inner-text">
                <h1>{{product.name}}</h1>
                <h1 id="product-description">{{product.description}}</h1>
            </div>
            <div class="grid-container-sp-inner-text">
                <h1>{{product.price}}</h1>
                <div class="grid-container-sp-inner-text-button">
                    <a href="">Add to cart</a>
                </div>
            </div>
        </div>
    </div>
    {{ load_footer() }}
</body>
</html>
